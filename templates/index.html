<script>
  async function sendMsg() {
    const input = document.getElementById("msg");
    const chat = document.getElementById("chat");
    const text = input.value.trim();
    if (!text) return;

    chat.innerHTML += <div class="text-green-400 mb-2">User: ${text}</div>;
    input.value = "";

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text})
      });

      const data = await res.json();
      if (data.error) {
        chat.innerHTML += <div class="text-red-400 mb-4">NIMA ERROR: ${data.error} - ${data.details || ''}</div>;
      } else {
        const reply = data?.choices?.[0]?.message?.content || "No response";
        chat.innerHTML += <div class="text-white mb-4">NIMA: ${reply}</div>;
      }
    } catch (err) {
      chat.innerHTML += <div class="text-red-400 mb-4">NIMA ERROR: ${err.message}</div>;
    }
    chat.scrollTop = chat.scrollHeight;
  }
</script>
