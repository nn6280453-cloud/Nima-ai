<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>NIMA AI - Research Terminal</title>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-4 text-blue-500">NIMA AI Terminal</h1>
        <div id="chat-box" class="bg-gray-800 p-4 h-96 overflow-y-auto mb-4 border border-gray-700 rounded"></div>
        <input id="user-input" type="text" class="w-full p-2 bg-gray-700 border border-gray-600 rounded" placeholder="Enter research query...">
        <button onclick="sendMessage()" class="mt-2 bg-blue-600 px-4 py-2 rounded">Execute Query</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input').value;
            const chat = document.getElementById('chat-box');
            chat.innerHTML += `<p class="text-green-400">User: ${input}</p>`;
            
            const response = await fetch('/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: input})
            });
            const data = await response.json();
            chat.innerHTML += `<p class="text-white">NIMA: ${data.choices[0].message.content}</p>`;
        }
    </script>
</body>
</html>
