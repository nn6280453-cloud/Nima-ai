<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIMA AI Terminal</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a hacker aesthetic */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827; 
        }
        ::-webkit-scrollbar-thumb {
            background: #374151; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; 
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4 font-mono">

    <div class="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[600px]">
        
        <!-- Header -->
        <div class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400 tracking-wider">NIMA AI TERMINAL</h1>
            <span class="text-xs text-green-500 flex items-center gap-1">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> ONLINE
            </span>
        </div>

        <!-- Chat Area -->
        <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-950">
            <div class="text-gray-400 text-sm border-b border-gray-800 pb-2 mb-2">
                System initialized. Waiting for input...
            </div>
            <!-- Messages will be injected here -->
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-900 border-t border-gray-800">
            <div class="flex gap-2">
                <input 
                    id="msg" 
                    class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 outline-none focus:border-blue-500 transition-colors text-white placeholder-gray-500" 
                    placeholder="Enter command or query..."
                    onkeypress="handleKeyPress(event)"
                >
                <button 
                    onclick="sendMsg()" 
                    id="sendBtn"
                    class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Send
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatDiv = document.getElementById("chat");
        const inputField = document.getElementById("msg");
        const sendBtn = document.getElementById("sendBtn");

        // Allow pressing "Enter" to send
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMsg();
            }
        }

        async function sendMsg() {
            const text = inputField.value.trim();
            if (!text) return;

            // Disable button while loading
            sendBtn.disabled = true;
            sendBtn.innerText = "...";

            // Add User Message to UI
            appendMessage("User", text, "text-green-400");
            inputField.value = "";

            try {
                const res = await fetch("/ask", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message: text})
                });

                const data = await res.json();

                if (data.error) {
                    appendMessage("NIMA ERROR", data.error, "text-red-400");
                } else {
                    // Display AI Response
                    appendMessage("NIMA", data.reply, "text-white");
                }

            } catch (err) {
                appendMessage("NIMA ERROR", `Connection failed: ${err.message}`, "text-red-400");
            } finally {
                // Re-enable button
                sendBtn.disabled = false;
                sendBtn.innerText = "Send";
                inputField.focus();
            }
        }

        function appendMessage(sender, text, colorClass) {
            const div = document.createElement("div");
            div.className = `${colorClass} mb-2 break-words`;
            
            // Simple formatting for sender name
            const senderSpan = `<span class="font-bold opacity-70">[${sender}]</span> `;
            div.innerHTML = senderSpan + text.replace(/\n/g, '<br>');
            
            chatDiv.appendChild(div);
            
            // Scroll to bottom
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }
    </script>
</body>
</html>
