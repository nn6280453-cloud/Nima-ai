<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>NIMA AI Terminal</title>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-5">
    <h1 class="text-3xl font-bold text-blue-400 mb-4">NIMA AI Terminal</h1>

    <div id="chat" class="h-96 overflow-y-auto bg-gray-950 rounded-xl p-4 border border-gray-800 mb-4"></div>

    <input id="msg" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 outline-none" placeholder="Type your message...">
    <button onclick="sendMsg()" class="mt-3 w-full bg-blue-600 hover:bg-blue-500 rounded-xl py-3 font-semibold">Execute Query</button>
  </div>

  <script>
    async function sendMsg() {
      const input = document.getElementById("msg");
      const chat = document.getElementById("chat");
      const text = input.value.trim();
      if (!text) return;

      chat.innerHTML += `<div class="text-green-400 mb-2">User: ${text}</div>`;
      input.value = "";

      const res = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text})
      });

      const data = await res.json();
      const reply = data?.choices?.[0]?.message?.content || "No response";
      chat.innerHTML += `<div class="text-white mb-4">NIMA: ${reply}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
